# -----------------------------------------------------------------------------
# Stock ANSI skin — terminal-following only
# Only the 16 tcell palette colors + `default` respect wezterm/melange.toml:
# black, maroon, green, olive, navy, purple, teal, silver,
# gray, red, lime, yellow, blue, fuchsia, aqua, white.
# Everything else (lightgray, steelblue, orange, ...) is fixed truecolor.
# All bgColor use `default` (transparent) to preserve terminal background.
# Exception: text on yellow surfaces uses *coal (terminal bg) — no ANSI
# name reaches this dark; everything else stays terminal-following.
# -----------------------------------------------------------------------------

# Lone exception to the ANSI-only rule (see above).
coal: &coal "#292522"  # terminal bg — text on yellow surfaces

k9s:
  body:
    fgColor: white
    bgColor: default
    logoColor: gray
    logoColorMsg: silver
    logoColorInfo: aqua
    logoColorWarn: yellow
    logoColorError: red
  prompt:
    fgColor: white
    bgColor: black
    suggestColor: gray
    border:
      command: yellow
      default: yellow
  info:
    fgColor: silver
    sectionColor: white
    cpuColor: lime
    memColor: blue
    k9sRevColor: yellow
  help:
    fgColor: white
    bgColor: default
    keyColor: yellow
    numKeyColor: yellow
    sectionColor: silver
  dialog:
    fgColor: white
    bgColor: default
    buttonFgColor: *coal
    buttonBgColor: silver
    buttonFocusFgColor: *coal
    buttonFocusBgColor: yellow
    labelFgColor: silver
    fieldFgColor: white
  frame:
    border:
      fgColor: gray
      focusColor: yellow
    menu:
      fgColor: white
      keyColor: yellow
      numKeyColor: yellow
    crumbs:
      fgColor: green
      bgColor: default
      activeColor: black
    status:
      newColor: aqua
      modifyColor: blue
      addColor: lime
      errorColor: red
      pendingColor: yellow
      highlightColor: yellow
      killColor: fuchsia
      completedColor: gray
    title:
      fgColor: white
      bgColor: default
      highlightColor: green
      counterColor: fuchsia
      filterColor: yellow
  views:
    charts:
      bgColor: default
      dialBgColor: default
      chartBgColor: default
      defaultDialColors:
        - blue
        - red
      defaultChartColors:
        - blue
        - red
      resourceColors:
        CPU:
          - aqua
          - blue
        MEM:
          - yellow
          - lime
      focusFgColor: *coal
      focusBgColor: yellow
    table:
      fgColor: white
      bgColor: default
      cursorFgColor: *coal
      cursorBgColor: yellow
      markColor: yellow
      header:
        fgColor: silver
        bgColor: default
        sorterColor: yellow
        selectedSortColumnColor: yellow
    xray:
      fgColor: white
      bgColor: default
      cursorColor: yellow
      cursorTextColor: *coal
      graphicColor: yellow
      showIcons: false
    yaml:
      keyColor: yellow
      colonColor: silver
      valueColor: white
    picker:
      mainColor: white
      focusColor: yellow
      shortcutColor: yellow
    logs:
      fgColor: white
      bgColor: default
      indicator:
        fgColor: white
        bgColor: default
        toggleOnColor: lime
        toggleOffColor: gray
