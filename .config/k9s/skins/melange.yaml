# -----------------------------------------------------------------------------
# Melange skin for k9s — fresh, minimal, functional
# Hex values taken directly from .config/wezterm/colors/melange.toml
# (foreground/background/selection + ansi + brights).
# All bgColor use `default` (transparent) to preserve terminal background.
# Palette roles: fg primary, secondary muted pair, one accent (yellow),
# semantic colors only where useful (ok/info/warn/error/kill/new).
# -----------------------------------------------------------------------------

# Palette (from melange.toml)
foreground: &fg "#ECE1D7"    # white / bright15 — primary fg
secondary: &secondary "#C1A78E" # silver / ansi7 — secondary fg
muted: &muted "#867462"        # gray / bright0 — muted/comment
active: &active "#34302C"      # ansi black — same as stock-ansi `black` in this terminal
coal: &coal "#292522"          # terminal bg — fg on yellow surfaces
yellow: &yellow "#EBC06D"      # yellow / bright3 — accent, cursor, focus
olive: &olive "#E49B5D"        # olive / ansi3 — pending/warn
green: &green "#85B695"        # lime / bright1 — ok/success
teal: &teal "#89B3B6"           # aqua / bright6 — new
blue: &blue "#A3A9CE"          # blue / bright4 — info/modify
red: &red "#D47766"            # red / bright1 — error
magenta: &magenta "#CF9BC2"    # fuchsia / bright5 — kill/special

k9s:
  body:
    fgColor: *fg
    bgColor: default
    logoColor: *muted
    logoColorMsg: *secondary
    logoColorInfo: *teal
    logoColorWarn: *yellow
    logoColorError: *red
  prompt:
    fgColor: *fg
    bgColor: *coal
    suggestColor: *muted
    border:
      command: *yellow
      default: *yellow
  info:
    fgColor: *secondary
    sectionColor: *fg
    cpuColor: *green
    memColor: *blue
    k9sRevColor: *yellow
  help:
    fgColor: *fg
    bgColor: default
    keyColor: *yellow
    numKeyColor: *yellow
    sectionColor: *secondary
  dialog:
    fgColor: *fg
    bgColor: default
    buttonFgColor: *coal
    buttonBgColor: *secondary
    buttonFocusFgColor: *coal
    buttonFocusBgColor: *yellow
    labelFgColor: *secondary
    fieldFgColor: *fg
  frame:
    border:
      fgColor: *muted
      focusColor: *yellow
    menu:
      fgColor: *fg
      keyColor: *yellow
      numKeyColor: *yellow
    crumbs:
      fgColor: *green
      bgColor: default
      activeColor: *active
    status:
      newColor: *teal
      modifyColor: *blue
      addColor: *green
      errorColor: *red
      pendingColor: *olive
      highlightColor: *yellow
      killColor: *magenta
      completedColor: *muted
    title:
      fgColor: *fg
      bgColor: default
      highlightColor: *teal
      counterColor: *magenta
      filterColor: *yellow
  views:
    charts:
      bgColor: default
      dialBgColor: default
      chartBgColor: default
      defaultDialColors:
        - *blue
        - *red
      defaultChartColors:
        - *blue
        - *red
      resourceColors:
        CPU:
          - *teal
          - *blue
        MEM:
          - *yellow
          - *green
      focusFgColor: *coal
      focusBgColor: *yellow
    table:
      fgColor: *fg
      bgColor: default
      cursorFgColor: *coal
      cursorBgColor: *yellow
      markColor: *yellow
      header:
        fgColor: *secondary
        bgColor: default
        sorterColor: *yellow
        selectedSortColumnColor: *yellow
    xray:
      fgColor: *fg
      bgColor: default
      cursorColor: *yellow
      cursorTextColor: *coal
      graphicColor: *yellow
      showIcons: false
    yaml:
      keyColor: *yellow
      colonColor: *secondary
      valueColor: *fg
    picker:
      mainColor: *fg
      focusColor: *yellow
      shortcutColor: *yellow
    logs:
      fgColor: *fg
      bgColor: default
      indicator:
        fgColor: *fg
        bgColor: default
        toggleOnColor: *green
        toggleOffColor: *muted
