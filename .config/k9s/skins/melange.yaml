# -----------------------------------------------------------------------------
# Melange skin for k9s — fresh, minimal, functional
# Hex values taken directly from .config/wezterm/colors/melange.toml
# (foreground/background/selection + ansi + brights).
# All bgColor use `default` (transparent) except prompt, which uses *bg.
# Palette roles: fg primary, secondary muted pair, one accent,
# semantic colors only where useful (ok/info/warn/error/kill/new).
# -----------------------------------------------------------------------------

# Palette (from melange.toml)
fg: &fg "#ECE1D7"               # white / bright15 — primary fg
bg: &bg "#292522"               # terminal bg — solid surfaces + text on yellow
secondary: &secondary "#C1A78E" # silver / ansi7 — secondary fg
muted: &muted "#867462"         # gray / bright0 — muted/comment
surface: &surface "#34302C"     # raised surface — active crumb pill (ansi black)
accent: &accent "#EBC06D"       # yellow / bright3 — accent, cursor, focus
red: &red "#D47766"             # red / bright1 — error
amber: &amber "#E49B5D"         # amber / ansi3 — pending/warn (renders orange, not olive)
green: &green "#85B695"         # lime / bright1 — ok/success
cyan: &cyan "#89B3B6"           # cyan / bright6 — new
blue: &blue "#A3A9CE"           # blue / bright4 — info/modify
magenta: &magenta "#CF9BC2"     # fuchsia / bright5 — kill/special

k9s:
  body:
    fgColor: *fg
    bgColor: default
    logoColor: *muted
    logoColorMsg: *secondary
    logoColorInfo: *cyan
    logoColorWarn: *accent
    logoColorError: *red
  prompt:
    fgColor: *fg
    bgColor: *bg
    suggestColor: *muted
    border:
      command: *accent
      default: *accent
  info:
    fgColor: *secondary
    sectionColor: *fg
    cpuColor: *green
    memColor: *blue
    k9sRevColor: *accent
  help:
    fgColor: *fg
    bgColor: default
    keyColor: *accent
    numKeyColor: *accent
    sectionColor: *secondary
  dialog:
    fgColor: *fg
    bgColor: default
    buttonFgColor: *bg
    buttonBgColor: *secondary
    buttonFocusFgColor: *bg
    buttonFocusBgColor: *accent
    labelFgColor: *secondary
    fieldFgColor: *fg
  frame:
    border:
      fgColor: *muted
      focusColor: *accent
    menu:
      fgColor: *fg
      keyColor: *accent
      numKeyColor: *accent
    crumbs:
      fgColor: *green
      bgColor: default
      activeColor: *surface
    status:
      newColor: *cyan
      modifyColor: *blue
      addColor: *green
      errorColor: *red
      pendingColor: *amber
      highlightColor: *accent
      killColor: *magenta
      completedColor: *muted
    title:
      fgColor: *fg
      bgColor: default
      highlightColor: *cyan
      counterColor: *magenta
      filterColor: *accent
  views:
    charts:
      bgColor: default
      dialBgColor: default
      chartBgColor: default
      defaultDialColors:
        - *blue
        - *red
      defaultChartColors:
        - *blue
        - *red
      resourceColors:
        CPU:
          - *cyan
          - *blue
        MEM:
          - *accent
          - *green
      focusFgColor: *bg
      focusBgColor: *accent
    table:
      fgColor: *fg
      bgColor: default
      cursorFgColor: *bg
      cursorBgColor: *accent
      markColor: *accent
      header:
        fgColor: *secondary
        bgColor: default
        sorterColor: *accent
        selectedSortColumnColor: *accent
    xray:
      fgColor: *fg
      bgColor: default
      cursorColor: *accent
      cursorTextColor: *bg
      graphicColor: *accent
      showIcons: false
    yaml:
      keyColor: *accent
      colonColor: *secondary
      valueColor: *fg
    picker:
      mainColor: *fg
      focusColor: *accent
      shortcutColor: *accent
    logs:
      fgColor: *fg
      bgColor: default
      indicator:
        fgColor: *fg
        bgColor: default
        toggleOnColor: *green
        toggleOffColor: *muted
