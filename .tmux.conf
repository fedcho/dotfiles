# Configuration
set -g default-terminal "tmux-256color"
# NOTE: use set -g (not -ga) so re-sourcing ~/.tmux.conf doesn't duplicate entries
set -g terminal-overrides "linux*:AX@,xterm-256color*:Tc"
set -s escape-time 10
set -s extended-keys on
set -as terminal-features ",xterm*:extkeys"
set -as terminal-features ",wezterm*:extkeys"
set -g extended-keys-format csi-u
set -g display-time 4000
set -g bell-action none
set -g history-limit 10000
set -g renumber-windows on
set -g focus-events on
set -g prefix C-a

# Source .tmux.conf as suggested in `man tmux`
bind R source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# Reuse the current path for new panes and windows
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Turn the mouse on, but without copy mode dragging
set -g mouse on
unbind -n MouseDrag1Pane
unbind -Tcopy-mode MouseDrag1Pane

# vi-mode configuration
set-window-option -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-on \; send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Navigation key bindings
bind ^  switch-client -l
bind h  select-window -l
bind j  select-window -t 0
bind k  select-window -t 1
bind l  select-window -t 2
bind \; select-window -t 3
bind "'" select-window -t 3

# Status bar 
source ~/.tmux/themes/melange.conf 

set -g status-style bg="#{E:@bg-format}",fg="#{E:@fg-format}"
set -g status-justify right
set -g status-left " #{session_name} "
set -g status-left-length 200
set -g window-status-format ' #I:#W#{?window_zoomed_flag, 󰊓 ,#{window_flags} }'
set -g window-status-current-format ' #I:#W#{?window_zoomed_flag, 󰊓 , }'
set -g window-status-current-style bg=default,fg="#{E:@hl-format}"
set -g status-right " "
set -g automatic-rename-format "[#{b;s/#{user}/home/i:pane_current_path}]#{?pane_dead,[dead],}"

# Additional key bindigns
bind t set-option -g status # Toggle status bar
bind S run -b tmux-session-picker
bind u run -b tmux-url-picker
unbind m # Disable marking panes

