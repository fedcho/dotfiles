# Configuration
set -g default-terminal "tmux-256color"
set -g terminal-overrides "linux*:AX@,xterm-256color*:Tc"
set -s escape-time 10
set -s extended-keys on
set -as terminal-features ",xterm*:extkeys"
set -as terminal-features ",wezterm*:extkeys"
set -g extended-keys-format csi-u
set -g display-time 4000
set -g bell-action none
set -g history-limit 10000
set -g renumber-windows on
set -g focus-events on
set -g prefix C-a
bind C-a send-prefix      

# Source .tmux.conf as suggested in `man tmux`
bind R source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# Reuse the current path for new panes and windows
bind '"' split-window -v -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Turn the mouse on, but without copy mode dragging
set -g mouse on
unbind -n MouseDrag1Pane
unbind -Tcopy-mode MouseDrag1Pane

# vi-mode configuration
set-window-option -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-on \; send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Navigation key bindings
bind ^  switch-client -l
bind h  select-window -l
bind j  select-window -t 0
bind k  select-window -t 1
bind l  select-window -t 2
bind \; select-window -t 3
bind "'" select-window -t 3

# Status bar 
set -g theme terminal 

set -g status-style "bg=default,fg=themewhite"
set -g window-status-current-style "noattr,fg=themegreen,bright"
set -g message-style "bg=themeblack,fg=themeyellow,#{?#{m/r:(^|#,)IS(PANE|MODE)($|#,),#{prompt_flags}},,fill=themeblack}"
set -g copy-mode-selection-style "#{E:mode-style}"
set -g tree-mode-selection-style "#{E:mode-style}"
set -g @prefix-style "bg=themegreen,fg=themeblack"

set -g status-left "#{?#{||:#{client_prefix},#{pane_in_mode}},#[#{@prefix-style}],#[default]}  #{session_name} #[default]"
set -g status-justify right
set -g status-left-length 201
set -g window-status-format ' #I:#W#{?window_zoomed_flag, 󰊓 , }'
set -g window-status-current-format ' #I:#W#{?window_zoomed_flag, 󰊓 , }'
set -g status-right " "
set -g automatic-rename-format "[#{b;s/#{user}/home/i:pane_current_path}]#{?pane_dead,[dead],}"

source ~/.tmux/themes/lumina/quartz.conf

# Additional key bindigns
bind t set-option -g status # Toggle status bar
bind S run -b tmux-session-picker
bind u run -b tmux-url-picker
unbind m # Disable marking panes

